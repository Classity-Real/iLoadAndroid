[package]
name = "isideload-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "isideload_android"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
omnisette = { git = "https://github.com/SideStore/apple-private-apis", branch = "master" }
icloud-auth = { git = "https://github.com/SideStore/apple-private-apis", branch = "master" }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
uniffi = { version = "0.28", features = ["tokio", "cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }