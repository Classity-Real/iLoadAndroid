[package]
name = "isideload-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "isideload_android"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
isideload = { version = "0.3.17", features = ["fs-storage"], git = "https://github.com/nab138/isideload", branch = "apple-codesign-quick" }
idevice = { version = "0.1.61", default-features = false, features = ["usbmuxd", "ring"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
webpki-roots = "0.26"
uniffi = { version = "0.28", features = ["tokio", "cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"