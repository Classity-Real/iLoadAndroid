name: Build iLoadAndroid

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973" && echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV" && echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Rust Android targets are installed
        run: for i in 1 2 3 4 5; do rustup target add aarch64-linux-android armv7-linux-androideabi && break || sleep 5; done

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/isideload-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Debug - inspect isideload anisette API
        run: cargo add isideload@0.3.17 --dry-run 2>/dev/null; find ~/.cargo/registry/src -path "*isideload-0.3.17/src/anisette*" -name "*.rs" -exec echo "=== {} ===" \; -exec cat {} \;

      - name: Build with cargo ndk
        working-directory: rust/isideload-android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../app/src/main/jniLibs build --release

      - name: Generate uniffi Kotlin bindings
        working-directory: rust/isideload-android
        run: cargo run --bin uniffi-bindgen -- generate --library ../../app/src/main/jniLibs/arm64-v8a/libisideload_android.so --language kotlin --out-dir ../../app/src/main/java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iLoadAndroid-debug
          path: app/build/outputs/apk/debug/*.apk
