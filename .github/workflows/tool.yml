name: Build iLoadAndroid

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: |
          BUILD_NUM=${{ github.run_number }}
          MAJOR=1
          MINOR=$((($BUILD_NUM - 1) / 10))
          PATCH=$((($BUILD_NUM - 1) % 10))
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "Calculated version: $VERSION (code: $BUILD_NUM)"

      - name: Update version in build.gradle.kts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"$VERSION\"/" app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973" && echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV" && echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Rust Android targets are installed
        run: for i in 1 2 3 4 5; do rustup target add aarch64-linux-android armv7-linux-androideabi && break || sleep 5; done

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/isideload-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build with cargo ndk
        working-directory: rust/isideload-android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../app/src/main/jniLibs build --release

      - name: Generate uniffi Kotlin bindings
        working-directory: rust/isideload-android
        run: cargo run --bin uniffi-bindgen -- generate --library ../../app/src/main/jniLibs/arm64-v8a/libisideload_android.so --language kotlin --out-dir ../../app/src/main/java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iLoadAndroid-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Compute APK checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: checksum
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$APK_PATH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "iLoadAndroid v${{ steps.version.outputs.version }}"
          body: |
            Commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            MD5 (apk): `${{ steps.checksum.outputs.md5 }}`
          files: ${{ steps.checksum.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
