name: Build iLoadAndroid

on:
  push:
    branches: [main]
    paths-ignore:
      - '**'
  pull_request:
    paths-ignore:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Ensure Rust Android targets are installed
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/isideload-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Builds the auth-layer cdylib for both ABIs and drops the .so files
      # straight into the Gradle jniLibs source set.
      - name: Build Rust auth crate for Android
        working-directory: rust/isideload-android
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../../app/src/main/jniLibs \
            build --release

      # uniffi-bindgen reads symbols out of the compiled cdylib to generate
      # the Kotlin bindings that AuthBridge.kt wraps. Any one ABI's .so works
      # for this step since the interface is the same across targets.
      - name: Generate uniffi Kotlin bindings
        working-directory: rust/isideload-android
        run: |
          cargo run --bin uniffi-bindgen -- generate \
            --library ../../app/src/main/jniLibs/arm64-v8a/libisideload_android.so \
            --language kotlin \
            --out-dir ../../app/src/main/java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iLoadAndroid-debug
          path: app/build/outputs/apk/debug/*.apk
